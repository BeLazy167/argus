# Self-hosts: change `app` to your own Fly app name before `fly deploy`.
app = 'argus-ai'
primary_region = 'iad'

# Swap absorbs brief allocation spikes that would otherwise OOM-kill the
# machine mid-review (exit_code=137 observed 2026-08-29, killing a run at the
# synthesis stage). Swap is a spike buffer, not extra capacity — if
# steady-state RSS approaches the VM size, scale memory instead.
#
# MUST stay above the first table header: TOML assigns any key after a header
# to that table, and flyctl silently drops unknown [[vm]] fields.
#
# Tradeoff accepted: swap makes in-memory secrets (the GitHub App RSA key, the
# AES master key) eligible to be paged to the machine filesystem, where an OOM
# kill previously left no residue.
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

# release_command runs once per deploy before new machines receive traffic. A non-zero exit
# from the migrator aborts the deploy — keeps the binary and the DB schema in lock-step.
[deploy]
  release_command = '/migrate'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

# Deep review fans out to 4 concurrent specialists, each holding an ~8k-token
# prompt plus a multi-thousand-token completion. On 512mb that combination
# OOM-killed the machine (exit_code=137, 2026-08-04); idle RSS is only ~22MB, so
# the spike is entirely review-driven, not a leak.
#
# GOMEMLIMIT and MEMPROF_RSS_THRESHOLD_MB are deliberately NOT set here. They are
# Fly secrets (currently 460MiB and 500), and a secret shadows an [env] entry of
# the same name — declaring them here would create a second source of truth that
# looks authoritative and isn't. Change them with `fly secrets set`, and keep the
# ratios: heap limit ~45% of VM, snapshot threshold below the ~57% kernel kill
# line. Resizing the VM here without moving those two leaves the heap ceiling
# above the kill line, which is worse than either setting alone.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'

# Two checks, two questions. `health` asks "is the process alive?" and hits
# /healthz, which returns a constant 200 and touches nothing. `ready` asks "can
# this machine actually serve?" and hits /readyz, which pings the store pool.
#
# Only /healthz was wired up until 2026-09-03. That day argus-db filled its
# volume and Postgres crash-looped for three days; /healthz kept returning
# {"status":"ok"} the whole time, so Fly reported the app healthy while every
# data request failed. A dead database must turn a check red.
#
# `ready` carries the longer grace_period because a booting machine opens the
# pool after the listener, and the longer interval because each probe costs a
# round trip to Postgres.
[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '2s'
    path = '/healthz'

  [checks.ready]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    path = '/readyz'
