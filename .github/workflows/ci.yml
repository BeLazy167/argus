name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # DATABASE_URL drives the Migrate step; tests gate on the dedicated
      # TEST_DATABASE_URL so `go test` can never touch a developer's real DB.
      DATABASE_URL: postgres://postgres:ci@localhost:5432/argus_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/argus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # PostgreSQL 17 + pgvector 0.8.5 — the versions production runs — from the
      # official pgvector image pinned by digest. See
      # .github/docker/ci-postgres/Dockerfile for why CI no longer runs 19beta2.
      - name: Build CI Postgres image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/ci-postgres
          load: true
          tags: argus-ci-postgres:local
          cache-from: type=gha,scope=ci-postgres
          cache-to: type=gha,scope=ci-postgres,mode=max
      - name: Start Postgres
        run: |
          docker run -d --name ci-pg \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=argus_test \
            -p 5432:5432 argus-ci-postgres:local
          for i in $(seq 1 30); do
            if docker exec ci-pg pg_isready -h 127.0.0.1 -U postgres -d argus_test; then exit 0; fi
            sleep 1
          done
          echo "postgres failed to become ready" >&2
          docker logs ci-pg >&2
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Migrate
        run: go run ./cmd/migrate
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      # Postgres-side evidence for any failure above. The Start step already
      # dumps this when the server never comes up, but a server that dies LATER
      # left nothing behind: golang-migrate reports only its client view, so a
      # backend crash during Migrate surfaced as "driver: bad connection" with
      # the whole failing statement echoed and no cause. Runs on 2026-09-04 and
      # 2026-09-06 failed that way on migration 057's HNSW index -- built over
      # an empty table, so not memory pressure -- and none could be diagnosed
      # from CI, because this log was discarded.
      #
      # That particular crash is gone: it was PostgreSQL 19beta2 plus pgvector
      # built from master, and CI now runs the versions production runs (#293).
      # The diagnostic gap it exposed is what this step closes, so the next
      # server-side death is readable on the first failure rather than the
      # sixth.
      - name: Postgres logs on failure
        if: failure()
        # Never let the diagnostic fail the job it is diagnosing. GitHub runs
        # this under `bash -e`, so a bare docker call against a container that
        # was never created (checkout, buildx, or the image build failed before
        # Start Postgres ran) would abort the step, drop the sections below it,
        # and show a second red step pointing away from the real cause.
        run: |
          if ! docker inspect ci-pg >/dev/null 2>&1; then
            echo "no ci-pg container — it never started, so there is nothing to dump"
            exit 0
          fi
          echo "=== docker logs ci-pg ==="
          docker logs ci-pg 2>&1 | tail -300 || true
          echo "=== container state ==="
          docker inspect ci-pg --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' || true
          echo "=== pgvector / server version ==="
          # Bounded: a hung postmaster accepts the connection and never answers,
          # and an unbounded psql would burn the job's full 6h default timeout.
          timeout 30 docker exec ci-pg psql -U postgres -d argus_test \
            -c "SELECT version()" \
            -c "SELECT extname, extversion FROM pg_extension" || true

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: go build -o /dev/null ./cmd/argus
      - name: tygo type drift check
        run: make tygo-check
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'
      - name: sqlc gen drift check
        run: make sqlc-check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # No explicit version — pnpm/action-setup reads the packageManager
      # field from web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Non-blocking until the pre-existing biome debt (~300 diagnostics on
      # main) is paid down — flip to blocking once `pnpm lint` is clean.
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Blocking: `tsc` and `next build` both compile files nobody imports, so
      # dead modules survive every other gate here. See #232 and #240 -- two
      # unreferenced "extracted components" directories that drifted from the
      # live inline copies they shadowed.
      - name: Unreferenced module check
        run: pnpm check:unreferenced
      # The check above is the only gate that can report dead code, so a hole
      # in it is silent by construction. These pin the two holes that made it
      # miss a dead _components dir: a route-convention filename inside a
      # private folder, and a commented-out import.
      - name: Unreferenced module check — self-tests
        run: pnpm test:scripts
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        run: pnpm build
